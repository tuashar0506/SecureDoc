[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "securedoc-nepal"
version = "0.0.1"
description = "Educational, locally pinned document signing and encryption"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SecureDoc Nepal contributors"}]
dependencies = ["cryptography>=46", "PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "black>=25",
]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
securedoc = "securedoc.cli:main"

[project.gui-scripts]
securedoc-gui = "securedoc.gui.desktop:launch"

[tool.setuptools.packages.find]
include = ["securedoc*"]

[tool.setuptools.package-data]
"securedoc.gui" = ["icons/*.svg", "icons/LICENSE*", "theme.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 88
target-version = ["py311"]
